<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1d12">
  <title>Foosball Commentator</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="scoreboard">
    <div class="team team0"><span id="name0">Red</span><b id="score0">0</b></div>
    <div class="clock" id="clock">0:00</div>
    <div class="team team1"><b id="score1">0</b><span id="name1">Blue</span></div>
    <button id="open-settings" class="icon" aria-label="Settings">⚙</button>
  </header>

  <main class="stage">
    <video id="video" playsinline muted></video>
    <canvas id="overlay"></canvas>
    <div id="goal-flash">GOAL!</div>
    <div id="subtitle" aria-live="polite"></div>
    <div class="status">
      <span id="fps"></span>
      <span id="ai-status" data-kind="offline"></span>
      <label class="tol">Tolerance <input id="tol-live" type="range" min="5" max="50"></label>
    </div>
  </main>

  <section id="panel" class="panel"></section>

  <dialog id="settings">
    <form id="settings-form" method="dialog">
      <h2>Settings</h2>
      <label>Claude API key
        <input name="apiKey" type="password" autocomplete="off" placeholder="sk-ant-… (empty = script lines only)">
      </label>
      <p class="hint">Stored only on this device and sent directly to the Claude API. The AI picks and stitches lines from the commentary database.</p>
      <label>Model
        <select name="model">
          <option value="claude-haiku-5-5">Claude Haiku 5.5 (fastest, recommended)</option>
          <option value="claude-sonnet-5-5">Claude Sonnet 5.5</option>
          <option value="claude-opus-5-5">Claude Opus 5.5 (best writing, slower)</option>
        </select>
      </label>
      <fieldset>
        <legend>Voices</legend>
        <label>Speech
          <select name="tts">
            <option value="browser">Browser voice (free, rather flat)</option>
            <option value="elevenlabs">ElevenLabs (natural and emotional)</option>
          </select>
        </label>
        <label>ElevenLabs API key <input name="elevenKey" type="password" autocomplete="off" placeholder="only needed for ElevenLabs"></label>
        <label>ElevenLabs model
          <input name="elevenModel" list="eleven-models" placeholder="eleven_flash_v2_5">
          <datalist id="eleven-models">
            <option value="eleven_flash_v2_5">fastest reaction</option>
            <option value="eleven_v3">more expressive, a bit slower</option>
          </datalist>
        </label>
        <div class="grid2">
          <label>Voice ID play-by-play <input name="voicePbp" autocomplete="off"></label>
          <label>Voice ID analyst <input name="voiceColor" autocomplete="off"></label>
        </div>
        <p class="hint">Find voice IDs in the ElevenLabs Voice Library (search for sports commentator voices).</p>
        <label class="check"><input name="expert" type="checkbox"> Analyst joins the commentary</label>
        <label>Crowd <input name="crowd" type="range" min="0" max="1" step="0.05"></label>
      </fieldset>
      <div class="grid2">
        <label>First to (goals) <input name="goalsToWin" type="number" min="1" max="30"></label>
        <span></span>
        <label>Left team <input name="name0"></label>
        <label>Right team <input name="name1"></label>
        <label>Table length (cm) <input name="tableLen" type="number" min="60" max="200"></label>
        <label>Table width (cm) <input name="tableWid" type="number" min="40" max="120"></label>
        <label>Shot from (km/h) <input name="shotKmh" type="number" min="5" max="60"></label>
        <label>Quiet-spell comment after (s) <input name="fillerSec" type="number" min="3" max="60"></label>
      </div>
      <label>Colour tolerance <input name="tol" type="range" min="5" max="50"></label>
      <label class="check"><input name="autoGoals" type="checkbox"> Detect goals automatically</label>
      <div class="row end">
        <button value="cancel" formnovalidate>Cancel</button>
        <button class="primary" value="ok">Save</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/main.js"></script>
</body>
</html>
