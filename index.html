<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1d12">
  <title>Kicker-Kommentator</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="scoreboard">
    <div class="team team0"><span id="name0">Heim</span><b id="score0">0</b></div>
    <div class="clock" id="clock">0:00</div>
    <div class="team team1"><b id="score1">0</b><span id="name1">Gast</span></div>
    <button id="open-settings" class="icon" aria-label="Einstellungen">⚙</button>
  </header>

  <main class="stage">
    <video id="video" playsinline muted></video>
    <canvas id="overlay"></canvas>
    <div id="goal-flash">TOR!</div>
    <div id="subtitle" aria-live="polite"></div>
    <div class="status">
      <span id="fps"></span>
      <span id="ai-status" data-kind="offline"></span>
      <label class="tol">Toleranz <input id="tol-live" type="range" min="5" max="50"></label>
    </div>
  </main>

  <section id="panel" class="panel"></section>

  <dialog id="settings">
    <form id="settings-form" method="dialog">
      <h2>Einstellungen</h2>
      <label>Claude API-Key
        <input name="apiKey" type="password" autocomplete="off" placeholder="sk-ant-… (leer = Kommentar mit Vorlagen)">
      </label>
      <p class="hint">Der Key wird nur auf diesem Gerät gespeichert und direkt an die Claude API gesendet.</p>
      <label>Modell
        <select name="model">
          <option value="claude-opus-5-5">Claude Opus 5.5 (beste Qualität)</option>
          <option value="claude-sonnet-5-5">Claude Sonnet 5.5</option>
          <option value="claude-haiku-5-5">Claude Haiku 5.5 (schnellste Reaktion, günstig)</option>
        </select>
      </label>
      <fieldset>
        <legend>Stimmen</legend>
        <label>Sprachausgabe
          <select name="tts">
            <option value="browser">Browser-Stimme (kostenlos, eher monoton)</option>
            <option value="elevenlabs">ElevenLabs (natürlich und emotional)</option>
          </select>
        </label>
        <label>ElevenLabs API-Key <input name="elevenKey" type="password" autocomplete="off" placeholder="nur für ElevenLabs nötig"></label>
        <label>ElevenLabs-Modell
          <input name="elevenModel" list="eleven-models" placeholder="eleven_flash_v2_5">
          <datalist id="eleven-models">
            <option value="eleven_flash_v2_5">schnellste Reaktion</option>
            <option value="eleven_v3">ausdrucksstärker, etwas langsamer</option>
          </datalist>
        </label>
        <div class="grid2">
          <label>Voice-ID Reporter <input name="voiceReporter" autocomplete="off"></label>
          <label>Voice-ID Experte <input name="voiceExperte" autocomplete="off"></label>
        </div>
        <p class="hint">Voice-IDs findest du in der ElevenLabs Voice Library (dort nach deutschen Sportkommentator-Stimmen suchen).</p>
        <label class="check"><input name="expert" type="checkbox"> Experte kommentiert mit</label>
        <label>Publikum <input name="crowd" type="range" min="0" max="1" step="0.05"></label>
      </fieldset>
      <div class="grid2">
        <label>Spiel bis (Tore) <input name="goalsToWin" type="number" min="1" max="30"></label>
        <span></span>
        <label>Team links <input name="name0"></label>
        <label>Team rechts <input name="name1"></label>
        <label>Tischlänge (cm) <input name="tableLen" type="number" min="60" max="200"></label>
        <label>Tischbreite (cm) <input name="tableWid" type="number" min="40" max="120"></label>
        <label>Schuss ab (km/h) <input name="shotKmh" type="number" min="5" max="60"></label>
        <label>Füllkommentar nach (s) <input name="fillerSec" type="number" min="3" max="60"></label>
      </div>
      <label>Farbtoleranz <input name="tol" type="range" min="5" max="50"></label>
      <label class="check"><input name="autoGoals" type="checkbox"> Tore automatisch erkennen</label>
      <div class="row end">
        <button value="cancel" formnovalidate>Abbrechen</button>
        <button class="primary" value="ok">Speichern</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/main.js"></script>
</body>
</html>
